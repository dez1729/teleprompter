name: Checks

on:
  pull_request:
  push:
    branches: [main]

# On a pull request, a newer push cancels the run it replaces. Every commit on main keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm -r typecheck
      - run: pnpm -r test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t teleprompter .
      - name: Serve the app and the API from the image
        id: serve
        run: |
          docker run -d --name teleprompter -p 127.0.0.1:4747:4747 teleprompter
          for try in $(seq 1 30); do
            curl -sf http://127.0.0.1:4747/api/script && break
            if [ "$try" = 30 ]; then echo "The server did not answer in 30 seconds." && exit 1; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:4747/ | grep -q '<div id="root">'
      - name: Show the container's output
        if: failure() && steps.serve.outcome == 'failure'
        run: docker logs teleprompter
