services:
  teleprompter:
    build: .
    image: teleprompter
    ports:
      # Loopback only. The server refuses any Host but localhost or 127.0.0.1 on this port.
      - "127.0.0.1:4747:4747"
    volumes:
      - teleprompter-data:/data
    extra_hosts:
      # Lets Follow reach a Whisper server on the host. Docker Desktop has this name already.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  teleprompter-data:
